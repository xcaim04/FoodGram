{% extends 'base.html' %}
{% block title %}Editar · {{ post.food_name }} · FoodGram{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">

  <div class="mb-6 flex items-center gap-3">
    <a href="{% url 'posts:detail' post.pk %}" class="text-ink-400 hover:text-ink-100 transition">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </a>
    <div>
      <h1 class="text-2xl font-display text-gradient">Editar publicación</h1>
      <p class="text-sm text-ink-400 mt-0.5">{{ post.food_name }}</p>
    </div>
  </div>

  <div class="fg-card p-6 animate-fade-in">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}

      <!-- Current image -->
      <div class="mb-5">
        <label class="block text-xs font-semibold text-ink-400 uppercase tracking-widest mb-2">
          Imagen actual
        </label>
        <div class="relative rounded-xl overflow-hidden mb-3" style="aspect-ratio:16/9; max-height:280px; background:#0d1117;">
          <img src="{{ post.image.url }}" alt="{{ post.food_name }}" class="w-full h-full object-cover" />
        </div>
        <label class="block text-xs font-medium text-ink-400 mb-1.5">Reemplazar imagen (opcional)</label>
        <input type="file" name="image" id="id_image" accept="image/*"
               class="w-full text-sm text-ink-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-surface-700 file:text-ink-200 hover:file:bg-surface-600 transition cursor-pointer" />
      </div>

      <!-- Food name -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-ink-400 uppercase tracking-widest mb-2">Nombre del plato</label>
        <input type="text" name="food_name" value="{{ form.food_name.value|default:'' }}"
               class="fg-input {% if form.food_name.errors %}error{% endif %}"
               placeholder="¿Cómo se llama este plato?" />
        {% for error in form.food_name.errors %}<p class="text-red-400 text-xs mt-1">{{ error }}</p>{% endfor %}
      </div>

      <!-- Caption -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-ink-400 uppercase tracking-widest mb-2">Descripción</label>
        <textarea name="caption" rows="3" class="fg-input resize-none"
                  placeholder="Cuéntanos sobre este plato...">{{ form.caption.value|default:'' }}</textarea>
      </div>

      <!-- Location + category -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-ink-400 uppercase tracking-widest mb-2">Ubicación</label>
          <div class="relative">
            <i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-ink-500 pointer-events-none"></i>
            <input type="text" name="location" value="{{ form.location.value|default:'' }}"
                   class="fg-input pl-9" placeholder="Restaurante, ciudad..." />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-ink-400 uppercase tracking-widest mb-2">Categoría</label>
          <select name="category" class="fg-input appearance-none cursor-pointer">
            <option value="">Sin categoría</option>
            {% for cat in form.category.field.queryset %}
            <option value="{{ cat.pk }}" {% if form.category.value == cat.pk|stringformat:"s" %}selected{% endif %}>
              {{ cat.emoji }} {{ cat.name }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-between gap-3 pt-4 border-t border-surface-700">
        <a href="{% url 'posts:detail' post.pk %}" class="fg-btn fg-btn-ghost text-sm">
          <i data-lucide="x" class="w-4 h-4"></i> Cancelar
        </a>
        <button type="submit" class="fg-btn fg-btn-primary text-sm px-6">
          <i data-lucide="save" class="w-4 h-4"></i> Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
